services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mariusbc
    container_name: mariusbc
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Required — generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      # Required — generate with: npm run gen:password "yourpassword"
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      # Editable site config, persisted on the named volume below
      CONFIG_PATH: /app/data/config.json
      # Optional — PostHog analytics (production)
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    volumes:
      # Persists config.json across redeploys
      - config-data:/app/data

volumes:
  config-data:
